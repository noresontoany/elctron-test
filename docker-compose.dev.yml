services:
  api:
    command: [sh, -c, "alembic upgrade head && python -m src.seed && exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
  frontend:
    build:
      target: build
    command: [sh, -c, "npm ci && npm run dev -- --port 3000"]
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
volumes:
  frontend_modules:
  frontend_nuxt:
